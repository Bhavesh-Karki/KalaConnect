name: kalaconnect
description: "KalaConnect, an offline Flutter student prototype for discovering fictional artisan products and craft stories."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  sqflite: ^2.4.1      # SQLite CRUD for enquiries (Unit 3.3)
  path: ^1.9.0          # Resolves the .db file path on device

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # No sqflite_common_ffi needed — AppController.load() accepts testEnquiries
  # to bypass SQLite in widget tests without any native plugin dependency.

flutter:
  uses-material-design: true

  assets:
    - assets/images/
